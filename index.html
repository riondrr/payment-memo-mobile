<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fcff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#080d12" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="引落メモ">
  <link rel="canonical" href="https://payment-memo-mobile.pages.dev/">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>口座別引落 月別管理</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfaf7;
      --ink: #24211c;
      --muted: #746d63;
      --line: #ded7cb;
      --panel: #fffdf9;
      --accent: #1976b9;
      --accent-soft: #dff2ff;
      --warn: #9b5d22;
      --rose: #b85454;
      --shadow: 0 20px 50px rgba(70, 55, 34, .12);
      --entry-label-height: 30px;
      --entry-control-height: 44px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% -10%, rgba(25, 118, 185, .13), transparent 32rem),
        linear-gradient(180deg, #f8fcff 0%, #ffffff 42%, #edf7fd 100%);
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 460px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 16px;
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      margin: 0 0 4px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 8px 22px rgba(75, 59, 35, .12);
      border: 1px solid rgba(98, 81, 50, .09);
      font-size: 21px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      min-width: 0;
      border: 1px solid var(--line);
      background: rgba(255, 253, 249, .84);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(65, 54, 38, .07);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      font-size: 21px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -16px 12px;
      padding: 10px 16px;
      background: rgba(247, 243, 235, .88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(173, 159, 136, .28);
    }

    .search-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-actions .search {
      min-width: 0;
    }

    .search-actions .soft-button {
      min-height: 44px;
      white-space: nowrap;
    }

    .search {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      height: 44px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--muted);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      min-width: 0;
    }

    .month-navigation {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 92px;
      gap: 8px;
    }

    .month-navigation button,
    .month-navigation select {
      height: 40px;
      min-width: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fffaf1;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .month-navigation select {
      width: 100%;
      padding: 0 34px 0 12px;
      text-align: center;
    }

    .month-navigation button:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    .primary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .monthly-table-panel {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .monthly-table-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 12px;
      font-weight: 800;
    }

    .monthly-table-chevron {
      color: var(--accent);
      font-size: 18px;
      transition: transform .18s ease;
    }

    .monthly-table-toggle[aria-expanded="true"] .monthly-table-chevron {
      transform: rotate(180deg);
    }

    .monthly-table-wrap {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .monthly-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .monthly-table th,
    .monthly-table td {
      border-bottom: 1px solid var(--line);
      padding: 9px 11px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .monthly-table th {
      color: var(--muted);
      font-size: 12px;
    }

    .monthly-table th:last-child,
    .monthly-table td:last-child {
      width: 38%;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .monthly-table tfoot td {
      border-bottom: 0;
      color: var(--accent);
      font-weight: 900;
    }

    .compact-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .soft-button {
      display: inline-grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid #c9e7f8;
      border-radius: 8px;
      background: var(--accent-soft);
      color: #0b5f94;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 800;
    }

    .soft-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .soft-button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .account-group {
      display: grid;
      gap: 8px;
    }

    .account-group + .account-group {
      margin-top: 12px;
    }

    .account-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 2px 5px;
      border-bottom: 1px solid rgba(173, 159, 136, .38);
    }

    .drag-handle {
      display: none;
      flex: 0 0 auto;
      width: 28px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
      user-select: none;
    }

    .list.reordering .drag-handle {
      display: grid;
      place-items: center;
    }

    .list.reordering .account-head {
      justify-content: flex-start;
    }

    .list.reordering .account-toggle {
      flex: 1 1 auto;
    }

    .list.reordering .entry-main {
      grid-template-columns: 28px 34px minmax(0, 1fr) auto;
    }

    .dragging {
      opacity: .55;
    }

    .drop-target {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .account-title {
      min-width: 0;
    }

    .account-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .account-chevron {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 18px;
      transition: transform .18s ease;
    }

    .account-toggle[aria-expanded="false"] .account-chevron {
      transform: rotate(-90deg);
    }

    .account-title strong {
      display: block;
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .account-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .account-total {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 18px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .account-items {
      display: grid;
      gap: 8px;
    }

    .account-items[hidden] {
      display: none;
    }

    .payment-group {
      display: grid;
      gap: 8px;
      margin-left: 14px;
      padding-left: 12px;
      border-left: 2px solid rgba(30, 134, 199, .18);
    }

    .payment-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .payment-group-toggle {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .payment-group-chevron {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 17px;
      transition: transform .18s ease;
    }

    .payment-group-toggle[aria-expanded="false"] .payment-group-chevron {
      transform: rotate(-90deg);
    }

    .payment-group-title {
      min-width: 0;
    }

    .payment-group-title strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .payment-group-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .payment-group-total {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .payment-group-items {
      display: grid;
      gap: 8px;
    }

    .payment-group-items[hidden] {
      display: none;
    }

    .entry {
      border: 1px solid var(--line);
      background: rgba(255, 253, 249, .92);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 28px rgba(72, 57, 37, .08);
    }

    .entry-main {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #b8ada0;
      background: #fff;
      color: white;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
    }

    .entry.done .check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .entry-title {
      min-width: 0;
    }

    .entry-title strong {
      display: block;
      max-width: 100%;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .entry-title > span {
      display: inline-block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .entry-edit {
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--accent);
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .entry-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .custom-cycle-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    .custom-cycle-control span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .payment-source,
    .billing-cycle {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .payment-source.direct {
      background: #f0eadf;
      color: #685c4d;
    }

    .payment-source.card {
      background: var(--accent-soft);
      color: #0b5f94;
    }

    .billing-cycle {
      background: #eaf6ff;
      color: #246b96;
      border: 1px solid #c9e7f8;
      font-size: 11px;
    }

    .amount-input {
      width: 112px;
      min-width: 0;
      height: 36px;
      border: 1px solid #cce8f7;
      border-radius: 8px;
      background: #eef9ff;
      padding: 5px 10px;
      outline-color: var(--accent);
      text-align: right;
      color: var(--accent);
      font: inherit;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .entry-fields {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      column-gap: 8px;
      row-gap: 8px;
      margin-top: 12px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field[hidden] {
      display: none;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: 1px solid #d8d0c3;
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 10px;
      outline-color: var(--accent);
    }

    .field input[type="date"] {
      min-width: 0;
      max-width: 100%;
    }

    .field textarea {
      min-height: 54px;
      resize: vertical;
    }

    .usage-period-control {
      display: grid;
      gap: 7px;
    }

    .usage-period-inputs {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 6px;
      align-items: center;
    }

    .usage-period-separator {
      color: var(--muted);
      font-weight: 800;
      text-align: center;
    }

    .inline-action {
      justify-self: start;
      min-height: 30px;
      border-radius: 999px;
      border: 1px solid #c9e7f8;
      background: #eef9ff;
      color: var(--accent);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .inline-action:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .entry-field-period {
      grid-column: 1 / -1;
    }

    .entry-field-label-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    .entry-fields .field > label,
    .entry-field-label-row {
      min-height: var(--entry-label-height);
      height: var(--entry-label-height);
    }

    .entry-fields .field > label {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .entry-field-label-row label {
      white-space: nowrap;
    }

    .entry-field-period .entry-field-label-row {
      height: auto;
      min-height: var(--entry-label-height);
      flex-wrap: wrap;
    }

    .entry-fields .field input,
    .entry-fields .field textarea {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      height: var(--entry-control-height);
      min-height: var(--entry-control-height);
      padding: 0 10px;
      line-height: 1.2;
    }

    .entry-fields .field textarea {
      resize: none;
      overflow: hidden;
    }

    .entry-fields .field input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
    }

    .entry-fields .usage-period-inputs {
      grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr);
      gap: 7px;
      width: 100%;
      min-width: 0;
    }

    .entry-fields .usage-period-inputs input {
      height: var(--entry-control-height);
      min-height: var(--entry-control-height);
    }

    .entry-field-period input {
      text-align: right;
    }

    .entry-field-debit {
      grid-column: span 6;
    }

    .entry-field-debit .debit-date-control {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .entry-fields .entry-field-debit .debit-date-control input {
      flex: 0 0 52px;
      width: 52px;
      text-align: left;
    }

    .entry-field-debit .inline-action {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .entry-field-note {
      grid-column: span 4;
    }

    .period-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-error {
      display: none;
      margin: 0;
      border: 1px solid #e6b7ad;
      border-radius: 8px;
      background: #fff1ed;
      color: #963e31;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-error.show {
      display: block;
    }

    .empty {
      border: 1px dashed #c8bdaa;
      border-radius: 8px;
      padding: 24px 14px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 253, 249, .56);
    }

    .sheet {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      max-height: 92vh;
      max-height: min(92dvh, calc(100dvh - env(safe-area-inset-top)));
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      transform: translateY(110%);
      transition: transform .22s ease;
      padding: 14px 16px max(18px, env(safe-area-inset-bottom));
      background: #fffdf9;
      border-radius: 18px 18px 0 0;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    .sheet.open {
      transform: translateY(0);
    }

    .sheet form {
      width: min(100%, 440px);
      margin: 0 auto;
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .view-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .view-toggle button {
      min-height: 38px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
    }

    .view-toggle button.active {
      background: var(--accent);
      color: white;
    }

    .calendar {
      display: grid;
      gap: 8px;
    }

    .calendar[hidden] {
      display: none;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .calendar-weekdays span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    .calendar-day {
      min-width: 0;
      min-height: 84px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 5px;
      text-align: left;
      vertical-align: top;
    }

    .calendar-day.outside {
      visibility: hidden;
    }

    .calendar-day.today {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .calendar-date-number {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 900;
    }

    .calendar-event {
      display: block;
      width: 100%;
      margin-top: 3px;
      overflow: hidden;
      border-radius: 5px;
      padding: 3px 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-event.paid {
      background: #e8f6ef;
      color: #27704d;
    }

    .trash-list,
    .day-detail-list {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .trash-item,
    .day-detail-item {
      display: grid;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 11px;
    }

    .trash-item-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .trash-item button,
    .day-detail-item button {
      min-height: 38px;
      border-radius: 8px;
      font-weight: 800;
    }

    .sheet-head {
      position: sticky;
      top: -14px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -14px -2px 0;
      padding: 14px 2px 10px;
      background: #fffdf9;
    }

    .sheet h2 {
      margin: 0;
      font-size: 18px;
    }

    #settingsSheet {
      display: grid;
      gap: 12px;
    }

    .primary {
      height: 44px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 800;
    }

    .danger {
      height: 40px;
      border-radius: 8px;
      background: #f7e6e2;
      color: var(--rose);
      font-weight: 800;
    }

    .danger:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .secondary {
      height: 44px;
      border: 1px solid #cfc5b7;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
    }

    .settings-link {
      display: grid;
      place-items: center;
      text-decoration: none;
    }

    .settings-trash-button {
      width: 100%;
    }

    .settings-delete-month-button {
      width: 100%;
    }

    .payment-method-list {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .payment-method-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: var(--panel);
    }

    .payment-method-table th,
    .payment-method-table td {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .payment-method-table th {
      background: #f4efe7;
      color: var(--muted);
      font-size: 12px;
    }

    .payment-method-table th:first-child {
      width: 52%;
    }

    .payment-method-table input {
      width: 100%;
      min-width: 0;
      height: 38px;
      border: 1px solid #cfc5b7;
      border-radius: 7px;
      background: #fff;
      padding: 0 9px;
      color: var(--ink);
    }

    .payment-method-table input[aria-invalid="true"] {
      border-color: var(--rose);
      box-shadow: 0 0 0 2px rgba(169, 68, 66, .12);
    }

    .payment-method-list-help {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    #paymentMethodsSheet {
      display: grid;
      gap: 12px;
    }

    .confirmation-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      white-space: pre-line;
    }

    .confirmation-actions {
      display: grid;
      gap: 10px;
    }

    #confirmSheet {
      z-index: 25;
    }

    .status {
      display: grid;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }

    .status strong {
      font-size: 14px;
    }

    .status span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .sync-panel {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }

    .sync-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sync-actions .secondary {
      height: 40px;
    }

    .otp-input {
      text-align: center;
      letter-spacing: .32em;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .field-hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .primary:disabled,
    .secondary:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .ad-slot {
      position: sticky;
      bottom: 0;
      display: none;
      min-height: 50px;
      margin: 16px -16px calc(-1 * max(24px, env(safe-area-inset-bottom)));
      padding: 8px 0 env(safe-area-inset-bottom);
      background: #fff;
      border-top: 1px solid var(--line);
    }

    .ad-slot.ready {
      display: grid;
      place-items: center;
    }

    .ad-slot .adsbygoogle {
      width: 100%;
      min-height: 50px;
    }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: rgba(33, 28, 20, .22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #080d12;
        --ink: #f1f6f9;
        --muted: #9eacb7;
        --line: #2b3a46;
        --panel: #111a22;
        --accent: #55b8f3;
        --accent-soft: #12364b;
        --warn: #e0a363;
        --rose: #ef8d8d;
        --shadow: 0 20px 50px rgba(0, 0, 0, .4);
      }

      body {
        background:
          radial-gradient(circle at 15% -10%, rgba(85, 184, 243, .16), transparent 32rem),
          linear-gradient(180deg, #080d12 0%, #0c141b 45%, #0a1117 100%);
      }

      .icon-button,
      .monthly-table-toggle,
      .monthly-table-wrap,
      .entry-edit {
        background: var(--panel);
      }

      .metric,
      .entry {
        background: rgba(17, 26, 34, .94);
        box-shadow: 0 10px 28px rgba(0, 0, 0, .24);
      }

      .toolbar {
        background: rgba(8, 13, 18, .9);
        border-bottom-color: rgba(108, 143, 165, .25);
      }

      .month-navigation button,
      .month-navigation select {
        background: #14202a;
      }

      .soft-button,
      .inline-action {
        border-color: #2c607e;
        background: #102d3e;
        color: #8fd4fb;
      }

      .account-head {
        border-bottom-color: rgba(108, 143, 165, .34);
      }

      .check {
        border-color: #647887;
        background: #0c141b;
      }

      .payment-source.direct {
        background: #302a23;
        color: #d8c7b1;
      }

      .payment-source.card {
        color: #9edcff;
      }

      .billing-cycle {
        border-color: #2c607e;
        background: #102d3e;
        color: #9edcff;
      }

      .amount-input {
        border-color: #2c607e;
        background: #0d2635;
        color: #8fd4fb;
      }

      .field input,
      .field textarea,
      .field select {
        border-color: #394b58;
        background: #0c141b;
        color: var(--ink);
      }

      .form-error {
        border-color: #7d4545;
        background: #321d1d;
        color: #ffaaaa;
      }

      .empty {
        border-color: #506270;
        background: rgba(17, 26, 34, .66);
      }

      .sheet,
      .sheet-head {
        background: var(--panel);
      }

      .danger {
        background: #3b2323;
        color: #ff9b9b;
      }

      .secondary,
      .status,
      .sync-panel {
        border-color: #394b58;
        background: #0c141b;
        color: var(--ink);
      }

      .scrim {
        background: rgba(0, 0, 0, .56);
      }
    }

    @media (max-width: 360px) {
      .payment-group {
        margin-left: 6px;
        padding-left: 7px;
      }

      .payment-group-head {
        padding-inline: 6px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .entry-field-period,
      .entry-field-debit,
      .entry-field-note {
        grid-column: 1 / -1;
      }

      .entry-field-debit .inline-action {
        padding-inline: 8px;
        font-size: 11px;
      }

      .amount-input {
        width: 92px;
      }

      .calendar-day {
        min-height: 70px;
        padding: 4px;
      }

      .primary-actions .soft-button,
      .search-actions .soft-button {
        padding-inline: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <p class="eyebrow">Monthly payments</p>
        <h1>口座別引落</h1>
      </div>
      <button class="icon-button" id="settingsButton" type="button" title="設定" aria-label="設定">⚙</button>
    </header>

    <section class="summary" aria-label="集計">
      <div class="metric">
        <span>今月の引落合計</span>
        <strong id="totalAmount">¥0</strong>
      </div>
      <div class="metric">
        <span>支払い済み</span>
        <strong id="paidCount">0 / 0</strong>
      </div>
    </section>

    <section class="toolbar">
      <nav class="month-navigation" id="monthTabs" aria-label="月"></nav>
    </section>

    <div class="view-toggle" role="tablist" aria-label="表示切替">
      <button class="active" id="listViewButton" type="button" role="tab" aria-selected="true">一覧</button>
      <button id="calendarViewButton" type="button" role="tab" aria-selected="false">カレンダー</button>
    </div>

    <section class="primary-actions" aria-label="追加操作">
      <button class="soft-button" id="addMonthButton" type="button">月を追加</button>
      <button class="soft-button" id="addEntryButton" type="button">支払い方法を追加</button>
    </section>

    <section class="search-actions" aria-label="検索と並び替え">
      <label class="search" for="searchInput">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="検索">
      </label>
      <button class="soft-button" id="reorderButton" type="button" aria-pressed="false">並び替え</button>
    </section>

    <div id="listView">
      <section class="monthly-table-panel" aria-label="月の内容と金額">
        <button class="monthly-table-toggle" id="monthlyTableToggle" type="button" aria-expanded="false" aria-controls="monthlyTableWrap">
          <span>内容・金額一覧</span>
          <span class="monthly-table-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="monthly-table-wrap" id="monthlyTableWrap" hidden></div>
      </section>
      <section class="list" id="entryList" aria-live="polite"></section>
    </div>
    <section class="calendar" id="calendarView" aria-label="支払いカレンダー" hidden></section>
    <aside class="ad-slot" id="adSlot" aria-label="広告"></aside>
  </main>

  <input id="importInput" type="file" accept="application/json" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="entrySheet" aria-hidden="true">
    <form id="entryForm" novalidate>
      <div class="sheet-head">
        <h2 id="sheetTitle">明細</h2>
        <button class="icon-button" id="closeSheetButton" type="button" title="閉じる" aria-label="閉じる">×</button>
      </div>
      <div class="field">
        <label for="debitAccountInput">引落口座</label>
        <select id="debitAccountInput" required></select>
      </div>
      <div class="field" id="customDebitAccountField" hidden>
        <label for="customDebitAccountInput">新しい引落口座</label>
        <input id="customDebitAccountInput" placeholder="口座名を入力">
      </div>
      <div class="field">
        <label for="paymentTypeInput">支払い種別</label>
        <select id="paymentTypeInput">
          <option value="direct">直接引落</option>
          <option value="card">カード払い</option>
        </select>
      </div>
      <div class="field" id="paymentMethodField">
        <label for="paymentMethodInput">カード名</label>
        <input id="paymentMethodInput" placeholder="リクルートカード">
      </div>
      <div class="field">
        <label for="contentInput">内容</label>
        <input id="contentInput" required>
      </div>
      <div class="field">
        <label for="paymentStartInput">作成日・加入日</label>
        <input id="paymentStartInput" inputmode="numeric" placeholder="2026-06 または 2026-06-15" aria-describedby="paymentStartHelp">
        <p class="field-hint" id="paymentStartHelp">不明な場合は空欄にすると、すべての年月に表示されます。</p>
      </div>
      <div class="field">
        <label for="billingCycleInput">支払い周期</label>
        <select id="billingCycleInput">
          <option value="1">毎月</option>
          <option value="2">2ヶ月ごと</option>
          <option value="3">3ヶ月ごと</option>
          <option value="6">6ヶ月ごと</option>
          <option value="12">12ヶ月ごと</option>
          <option value="custom">カスタム</option>
        </select>
      </div>
      <div class="field" id="customBillingCycleField" hidden>
        <label for="customBillingCycleInput">カスタム周期</label>
        <div class="custom-cycle-control">
          <input id="customBillingCycleInput" type="number" inputmode="numeric" min="1" max="120" step="1" placeholder="例: 5">
          <span>ヶ月ごと</span>
        </div>
      </div>
      <div class="field">
        <label for="noteInput">備考</label>
        <textarea id="noteInput"></textarea>
      </div>
      <p class="form-error" id="entryError" role="alert"></p>
      <button class="primary" type="submit">保存</button>
      <button class="danger" id="deleteEntryButton" type="button">削除</button>
    </form>
  </aside>
  <aside class="sheet" id="trashSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>最近削除した項目</h2>
      <button class="icon-button" id="closeTrashSheetButton" type="button" aria-label="最近削除を閉じる">×</button>
    </div>
    <p class="form-error" id="trashError" role="alert"></p>
    <div class="trash-list" id="trashList"></div>
  </aside>
  <aside class="sheet" id="daySheet" aria-hidden="true">
    <div class="sheet-head">
      <h2 id="daySheetTitle">日付の詳細</h2>
      <button class="icon-button" id="closeDaySheetButton" type="button" aria-label="日付詳細を閉じる">×</button>
    </div>
    <div class="day-detail-list" id="dayDetailList"></div>
  </aside>
  <aside class="sheet" id="monthSheet" aria-hidden="true">
    <form id="monthForm">
      <div class="sheet-head">
        <h2>年月を追加</h2>
        <button class="icon-button" id="closeMonthSheetButton" type="button" title="閉じる" aria-label="年月追加を閉じる">×</button>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="yearInput">年</label>
          <select id="yearInput"></select>
        </div>
        <div class="field">
          <label for="monthInput">月</label>
          <select id="monthInput"></select>
        </div>
      </div>
      <p class="form-error" id="monthError" role="alert"></p>
      <button class="primary" type="submit">追加</button>
    </form>
  </aside>
  <aside class="sheet" id="settingsSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>設定</h2>
      <button class="icon-button" id="closeSettingsSheetButton" type="button" title="閉じる" aria-label="設定を閉じる">×</button>
    </div>
    <button class="secondary" id="paymentMethodsButton" type="button">支払い方法一覧</button>
    <button class="secondary settings-trash-button" id="trashButton" type="button">最近削除</button>
    <button class="danger settings-delete-month-button" id="deleteMonthButton" type="button">表示中の年月を削除</button>
    <div class="status">
      <strong>クラウド同期</strong>
      <span id="cloudSyncStatus" role="status" aria-live="polite">未接続</span>
    </div>
    <div class="sync-panel">
      <div class="field">
        <label for="emailInput">メールアドレス</label>
        <input id="emailInput" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <button class="primary" id="sendOtpButton" type="button">認証コードを送信</button>
      <div class="field">
        <label for="otpInput">6桁の認証コード</label>
        <input class="otp-input" id="otpInput" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" aria-describedby="otpHelp">
        <p class="field-hint" id="otpHelp">メールに届いた最新のコードを10分以内に入力してください。</p>
      </div>
      <button class="primary" id="verifyOtpButton" type="button">コードでログイン</button>
      <div class="sync-actions">
        <button class="secondary" id="syncNowButton" type="button">今すぐ同期</button>
        <button class="secondary" id="signOutButton" type="button">ログアウト</button>
      </div>
    </div>
    <button class="secondary" id="exportButton" type="button">バックアップを書き出す</button>
    <button class="secondary" id="importButton" type="button">バックアップから復元する</button>
    <a class="secondary settings-link" href="privacy.html">プライバシーポリシー</a>
  </aside>
  <aside class="sheet" id="paymentMethodsSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>支払い方法一覧</h2>
      <button class="icon-button" id="closePaymentMethodsSheetButton" type="button" title="閉じる" aria-label="支払い方法一覧を閉じる">×</button>
    </div>
    <p class="payment-method-list-help">開始日は「2026-06」または「2026-06-15」の形式で入力できます。空欄の場合はすべての年月に表示します。</p>
    <p class="form-error" id="paymentMethodsError" role="alert"></p>
    <div class="payment-method-list" id="paymentMethodList"></div>
    <button class="primary" id="addPaymentMethodFromListButton" type="button">支払い方法を追加</button>
  </aside>
  <aside class="sheet" id="confirmSheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="sheet-head">
      <h2 id="confirmTitle">確認</h2>
      <button class="icon-button" id="closeConfirmSheetButton" type="button" title="閉じる" aria-label="確認画面を閉じる">×</button>
    </div>
    <p class="confirmation-copy" id="confirmMessage"></p>
    <div class="confirmation-actions" id="confirmActions"></div>
  </aside>

  <script
