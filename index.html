    function saveEntry(event) {
      event.preventDefault();
      const month = currentMonth();
      const paymentType = normalizePaymentType(paymentTypeInput.value);
      const debitAccount = debitAccountInput.value === "__custom__"
        ? customDebitAccountInput.value.trim()
        : debitAccountInput.value.trim();
      const paymentMethod = paymentType === "card" ? paymentMethodInput.value.trim() : "";
      const content = contentInput.value.trim();
      const paymentStartDate = paymentStartInput.value.trim();
      const selectedCycleValue = billingCycleInput.value === "custom"
        ? customBillingCycleInput.value
        : billingCycleInput.value;
      const existingItem = editingId ? month.items.find(entry => entry.id === editingId) : null;

      if (!debitAccount) {
        showEntryError("引落口座を入力してください。");
        return;
      }

      if (!content) {
        showEntryError("内容を入力してください。");
        return;
      }

      if (!isValidPaymentStartDate(paymentStartDate)) {
        showEntryError("作成日・加入日は「YYYY-MM」または「YYYY-MM-DD」の形式で入力してください。");
        return;
      }

      if (paymentType === "card" && !paymentMethod) {
        showEntryError("カード払いの場合はカード名を入力してください。");
        return;
      }

      if (!isValidBillingCycleMonths(selectedCycleValue)) {
        showEntryError("支払い周期は1〜120ヶ月の整数で入力してください。");
        return;
      }

      const billingCycleMonths = Number(selectedCycleValue);
      const existingCycle = normalizeBillingCycleMonths(existingItem?.billingCycleMonths);
      const billingStartMonth = existingItem && existingCycle === billingCycleMonths
        ? normalizeBillingStartMonth(existingItem.billingStartMonth, month.id)
        : month.id;

      const payload = {
        debitAccount,
        paymentType,
        paymentMethod,
        content,
        amount: existingItem?.amount || "",
        usedDate: existingItem?.usedDate || "",
        debitDate: existingItem?.debitDate || "",
        debitDay: existingItem?.debitDay || null,
        billingCycleMonths,
        billingStartMonth,
        usagePeriodStart: existingItem?.usagePeriodStart || "",
        usagePeriodEnd: existingItem?.usagePeriodEnd || "",
        paidDate: existingItem?.paidDate || "",
        note: noteInput.value.trim()
      };

      if (editingId) {
        const item = existingItem;
        Object.assign(item, { seriesId: item.seriesId || item.id }, payload);
        let method = paymentMethodForItem(item);
        if (!method) {
          method = { id: item.seriesId, name: content, startDate: paymentStartDate, defaults: {} };
          state.paymentMethods.push(method);
        }
        method.name = content;
        method.startDate = normalizePaymentStartDate(paymentStartDate);
        method.defaults = paymentMethodDefaultsFromItem(item, month.id);
        syncAllPaymentMethodNames(state.paymentMethods, state.months);
      } else {
        const id = crypto.randomUUID();
        const currentItem = normalizeItem({ id, seriesId: id, paid: false, ...payload }, month.id);
        const method = {
          id,
          name: content,
          startDate: normalizePaymentStartDate(paymentStartDate),
          defaults: paymentMethodDefaultsFromItem(currentItem, month.id)
        };
        state.paymentMethods.push(method);
        state.months.forEach(targetMonth => {
          if (targetMonth.id === month.id) {
            targetMonth.items.push(currentItem);
          } else {
            targetMonth.items.push(createItemFromPaymentMethod(method, targetMonth.id, currentItem, month.id));
          }
        });
      }
      persist();
      closeSheet();
      render();
    }

    function syncPaymentMethodField() {
      clearEntryError();

    function showEntryError(message) {

    function deleteEntry() {
      if (!editingId) return;
      const month = currentMonth();
      const item = month.items.find(entry => entry.id === editingId);
      if (!item) return;
      const label = paymentMethodName(item);
      openConfirmation({
        title: `${label}を削除`,
        message: "削除する範囲を選んでください。削除後30日間は「最近削除」から復元できます。",
        actions: [
          {
            label: "この月",
            className: "danger",
            handler: () => deleteEntryByRange(item, "current")
          },
          {
            label: "これ以降",
            className: "danger",
            handler: () => deleteEntryByRange(item, "after")
          },
          {
            label: "これ以前",
            className: "danger",
            handler: () => deleteEntryByRange(item, "before")
          },
          {
            label: "すべて",
            className: "danger",
            handler: () => deleteEntryByRange(item, "all")
          }
        ]
      });
    }

    function deleteEntryByRange(targetItem, scope) {
      const seriesId = String(targetItem.seriesId || targetItem.id);
      const activeMonthId = currentMonth().id;
      const method = paymentMethodForItem(targetItem);
      const deletedEntries = [];
      state.months.forEach(month => {
        const inRange = scope === "all" ||
          (scope === "current" && month.id === activeMonthId) ||
          (scope === "after" && month.id >= activeMonthId) ||
          (scope === "before" && month.id <= activeMonthId);
        if (!inRange) return;
        const keptItems = [];
        month.items.forEach(item => {
          const matches = String(item.seriesId || item.id) === seriesId;
          if (matches) {
            deletedEntries.push({
              monthId: month.id,
              monthLabel: month.label,
              item: structuredClone(item)
            });
          } else {
            keptItems.push(item);
          }
        });
        month.items = keptItems;
      });
      if (!deletedEntries.length) return;
      if (scope === "all") {
        state.paymentMethods = state.paymentMethods.filter(entry => entry.id !== seriesId);
      }
      state.trash.push({
        id: crypto.randomUUID(),
        kind: "series",
        deletedAt: new Date().toISOString(),
        label: method?.name || targetItem.content || "支払い方法",
        scope,
        paymentMethod: method ? structuredClone(method) : null,
        entries: deletedEntries
      });
      persist();
      closeSheet();
      render();
    }

    async function exportJson() {
      const backupText = JSON.stringify(state, null, 2);
      const blob = new Blob([backupText], { type: "application/json" });
      const file = new File([blob], "payment-notes.json", { type: "application/json" });

      if (navigator.share && navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: "引落メモのバックアップ"
          });
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
          console.warn(error);
        }
      }

      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "payment-notes.json";
      anchor.hidden = true;
      document.body.appendChild(anchor);
      anchor.click();
      setTimeout(() => {
        anchor.remove();
        URL.revokeObjectURL(url);
      }, 30000);
    }

    async function importJson(event) {
      const [file] = event.target.files;
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        if (!imported || !Array.isArray(imported.months) || !imported.months.length) {
          throw new Error("Invalid backup");
        }
        replaceState(imported, imported.updatedAt);
        persist({ keepUpdatedAt: true });
        closeSettingsSheet();
        render();
      } catch (error) {
        alert("バックアップファイルを読み込めませんでした。");
      } finally {
        event.target.value = "";
      }
    }

    async function setupCloudSync() {
      if (!isCloudSyncConfigured()) {
        renderIntegrationStatus();
        return;
      }

      if (!window.supabase?.createClient) {
        renderIntegrationStatus("Supabaseライブラリを読み込めませんでした。");
        return;
      }

      supabaseClient = window.supabase.createClient(
        config.supabaseUrl,
        config.supabasePublishableKey,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      supabaseClient.auth.onAuthStateChange(async (_event, session) => {
        currentSession = session;
        if (session?.user) {
          emailInput.value = session.user.email || "";
          switchToUserStorage(session.user);
          render();
          await syncState();
        } else {
          switchToAnonymousStorage();
          render();
        }
        renderIntegrationStatus();
      });

      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        currentSession = data.session;
        if (currentSession?.user) {
          emailInput.value = currentSession.user.email || "";
          switchToUserStorage(currentSession.user);
          render();
          await syncState();
        } else {
          switchToAnonymousStorage();
          render();
        }
      } catch (error) {
        handleSyncError(error);
      }
    }

    function isCloudSyncConfigured() {
      return Boolean(
        config.cloudSyncEnabled &&
        config.supabaseUrl &&
        config.supabasePublishableKey
      );
    }

    async function sendEmailOtp() {
      if (!isCloudSyncConfigured() || !supabaseClient) return;
      if (otpRequestPending || currentSession) return;

      const cooldownSeconds = otpCooldownSecondsRemaining();
      if (cooldownSeconds > 0) {
        renderIntegrationStatus(`メールの再送はあと${cooldownSeconds}秒お待ちください。`);
        return;
      }

      const email = emailInput.value.trim();
      if (!email) {
        renderIntegrationStatus("メールアドレスを入力してください。");
        return;
      }

      if (!emailInput.checkValidity()) {
        renderIntegrationStatus("有効なメールアドレスを入力してください。");
        return;
      }

      try {
        otpRequestPending = true;
        updateCloudSyncControls();
        renderIntegrationStatus("認証コードを送信中...");
        const { error } = await supabaseClient.auth.signInWithOtp({
          email,
          options: {
            shouldCreateUser: true
          }
        });
        if (error) throw error;
        otpHasBeenSent = true;
        otpInput.value = "";
        startOtpCooldown(otpResendCooldownSeconds);
        otpInput.focus();
        renderIntegrationStatus("6桁の認証コードを送信しました。最新のコードを入力してください。");
      } catch (error) {
        const retryMatch = String(error?.message || "").match(/after\s+(\d+)\s+seconds?/i);
        if (retryMatch) {
          const retrySeconds = Math.max(1, Number(retryMatch[1]) || otpResendCooldownSeconds);
          startOtpCooldown(retrySeconds);
          renderIntegrationStatus(`メールの再送は${retrySeconds}秒後にお試しください。`);
        } else {
          handleOtpError(error, "認証コードを送信できませんでした。時間を置いて再度お試しください。");
        }
      } finally {
        otpRequestPending = false;
        updateCloudSyncControls();
      }
    }

    async function verifyEmailOtp() {
      if (!isCloudSyncConfigured() || !supabaseClient) return;
      if (otpVerifyPending || currentSession) return;

      const email = emailInput.value.trim();
      const token = otpInput.value.trim();
      if (!email || !emailInput.checkValidity()) {
        renderIntegrationStatus("有効なメールアドレスを入力してください。");
        return;
      }
      if (!/^\d{6}$/.test(token)) {
        renderIntegrationStatus("メールに届いた6桁の認証コードを入力してください。");
        otpInput.focus();
        return;
      }

      try {
        otpVerifyPending = true;
        updateCloudSyncControls();
        renderIntegrationStatus("認証コードを確認中...");
        const { data, error } = await supabaseClient.auth.verifyOtp({
          email,
          token,
          type: "email"
        });
        if (error) throw error;
        if (!data?.session) throw new Error("session_not_created");

        otpInput.value = "";
        otpHasBeenSent = false;
        if (!currentSession) {
          currentSession = data.session;
          emailInput.value = data.session.user.email || email;
          switchToUserStorage(data.session.user);
          render();
          await syncState();
        }
        renderIntegrationStatus("認証しました。クラウド同期に接続済みです。");
      } catch (error) {
        handleOtpError(error, "認証コードが正しくないか、期限が切れています。最新のコードを再送してください。");
      } finally {
        otpVerifyPending = false;
        updateCloudSyncControls();
      }
    }

    function normalizeOtpInput() {
      otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6);
      updateCloudSyncControls();
    }

    function otpCooldownSecondsRemaining() {
      return Math.max(0, Math.ceil((otpCooldownUntil - Date.now()) / 1000));
    }

    function startOtpCooldown(seconds) {
      otpCooldownUntil = Date.now() + (seconds * 1000);
      clearTimeout(otpCooldownTimer);

      const tick = () => {
        if (otpCooldownSecondsRemaining() <= 0) {
          otpCooldownUntil = 0;
          updateCloudSyncControls();
          return;
        }
        updateCloudSyncControls();
        otpCooldownTimer = setTimeout(tick, 1000);
      };
      tick();
    }

    function handleOtpError(error, fallbackMessage) {
      const code = String(error?.code || "");
      const message = String(error?.message || "");
      const status = Number(error?.status || 0);
      console.warn("OTP authentication failed", { code, status });

      if (code === "otp_expired" || /expired|invalid.*token|token.*invalid/i.test(message)) {
        renderIntegrationStatus("認証コードが正しくないか、期限が切れています。最新のコードを再送してください。");
      } else if (status === 429 || /rate limit|too many/i.test(message)) {
        renderIntegrationStatus("試行回数が多すぎます。しばらく待ってから再度お試しください。");
      } else if (/email address not authorized/i.test(message)) {
        renderIntegrationStatus("このメールアドレスには認証メールを送信できません。メール送信設定を確認してください。");
      } else {
        renderIntegrationStatus(fallbackMessage);
      }
    }

    async function signOut() {
      if (!supabaseClient) return;
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        clearTimeout(syncTimer);
        clearTimeout(otpCooldownTimer);
        otpCooldownUntil = 0;
        otpHasBeenSent = false;
        otpInput.value = "";
        currentSession = null;
        switchToAnonymousStorage();
        render();
        renderIntegrationStatus("ログアウトしました。");
      } catch (error) {
        handleSyncError(error);
      }
    }

    function scheduleCloudSync() {
      if (!currentSession || !supabaseClient) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        pushStateToCloud().catch(handleSyncError);
      }, 900);
    }

    async function syncState(options = {}) {
      if (!currentSession || !supabaseClient) {
        renderIntegrationStatus();
        return;
      }

      try {
        renderIntegrationStatus("同期中...");
        const { data, error } = await supabaseClient
          .from(syncTable)
          .select("state, updated_at")
          .eq("user_id", currentSession.user.id)
          .maybeSingle();

        if (error) throw error;

        const localUpdatedAt = new Date(state.updatedAt || 0).getTime();
        const remoteUpdatedAt = new Date(data?.updated_at || 0).getTime();

        const shouldUseRemote = data?.state &&
          !options.forcePush &&
          (activeStateSource === "seed" || remoteUpdatedAt > localUpdatedAt);

        if (shouldUseRemote) {
          const remoteNeedsMigration = Number(data.state?.schemaVersion || 0) < currentSchemaVersion;
          activeStateSource = "remote";
          replaceState(data.state, data.updated_at);
          render();
          if (remoteNeedsMigration) {
            await pushStateToCloud();
            return;
          }
          renderIntegrationStatus(`同期済み ${formatDateTime(data.updated_at)}`);
          return;
        }

        await pushStateToCloud();
      } catch (error) {
        handleSyncError(error);
      }
    }

    async function pushStateToCloud() {
      if (!currentSession || !supabaseClient) return;

      const updatedAt = new Date().toISOString();
      state.updatedAt = updatedAt;

      const { error } = await supabaseClient
        .from(syncTable)
        .upsert({
          user_id: currentSession.user.id,
          state: structuredClone(state),
          updated_at: updatedAt
        }, { onConflict: "user_id" });

      if (error) throw error;

      localStorage.setItem(activeStorageKey, JSON.stringify(state));
      activeStateSource = "user";
      renderIntegrationStatus(`同期済み ${formatDateTime(updatedAt)}`);
    }

    function handleSyncError(error) {
      console.warn(error);
      renderIntegrationStatus(`同期エラー: ${error.message || "不明なエラー"}`);
    }

    function renderIntegrationStatus(message) {
      const configured = isCloudSyncConfigured();
      const connected = Boolean(currentSession);
      const defaultMessage = configured
        ? connected
          ? `接続済み: ${currentSession.user.email || "ログイン中"}`
          : "未ログイン。メールに届く6桁コードでログインできます。"
        : "Supabase設定が必要です。設定後もローカル保存は使えます。";

      document.getElementById("cloudSyncStatus").textContent = message || defaultMessage;

      updateCloudSyncControls();
    }

    function updateCloudSyncControls() {
      const configured = isCloudSyncConfigured();
      const connected = Boolean(currentSession);
      const cooldownSeconds = otpCooldownSecondsRemaining();
      const busy = otpRequestPending || otpVerifyPending;
      const emailReady = Boolean(emailInput.value.trim()) && emailInput.checkValidity();
      const otpReady = /^\d{6}$/.test(otpInput.value);

      emailInput.disabled = !configured || connected || busy;
      sendOtpButton.disabled = !configured || connected || busy || !emailReady || cooldownSeconds > 0;
      sendOtpButton.textContent = cooldownSeconds > 0
        ? `再送まで ${cooldownSeconds}秒`
        : otpHasBeenSent
          ? "認証コードを再送"
          : "認証コードを送信";
      otpInput.disabled = !configured || connected || busy;
      verifyOtpButton.disabled = !configured || connected || busy || !emailReady || !otpReady;
      signOutButton.disabled = !configured || !connected;
      syncNowButton.disabled = !configured || !connected;
    }

    function setupWebAds() {
      adSlot.classList.remove("ready");
      adSlot.replaceChildren();

      if (!isWebAdsConfigured()) return;

      const publisherId = String(config.adsensePublisherId || "").trim();
      const slotId = String(config.adsenseBannerSlotId || "").trim();
      window.adsbygoogle = window.adsbygoogle || [];

      if (config.adsenseNonPersonalizedAds !== false) {
        window.adsbygoogle.requestNonPersonalizedAds = 1;
      }

      const banner = document.createElement("ins");
      banner.className = "adsbygoogle";
      banner.style.display = "block";
      banner.setAttribute("data-ad-client", publisherId);
      banner.setAttribute("data-ad-slot", slotId);
      banner.setAttribute("data-ad-format", "auto");
      banner.setAttribute("data-full-width-responsive", "true");
      adSlot.appendChild(banner);
      adSlot.classList.add("ready");
      loadAdsenseScript(publisherId);

      try {
        window.adsbygoogle.push({});
      } catch (error) {
        console.warn(error);
      }
    }

    function isWebAdsConfigured() {
      return Boolean(
        config.webAdsEnabled &&
        config.webAdsProvider === "adsense" &&
        String(config.adsensePublisherId || "").trim() &&
        String(config.adsenseBannerSlotId || "").trim() &&
        !isLocalAdHost()
      );
    }

    function isLocalAdHost() {
      return location.protocol === "file:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.hostname === "0.0.0.0" ||
        location.hostname === "::1";
    }

    function loadAdsenseScript(publisherId) {
      const scriptId = "adsense-script";
      if (document.getElementById(scriptId)) return;

      const script = document.createElement("script");
      script.id = scriptId;
      script.async = true;
      script.crossOrigin = "anonymous";
      script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(publisherId)}`;
      document.head.appendChild(script);
    }

    function formatDateTime(value) {
      if (!value) return "";
      return new Intl.DateTimeFormat("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function toNumber(value) {
      return Number(String(value).replace(/[^\d.-]/g, "")) || 0;
    }

    function normalizeAmountValue(value) {
      const digits = String(value ?? "").replace(/[^\d]/g, "");
      if (!digits) return "";
      return String(Number(digits));
    }

    function formatAmountInput(value) {
      const normalized = normalizeAmountValue(value);
      return normalized ? new Intl.NumberFormat("ja-JP").format(Number(normalized)) : "";
    }

    function formatAmountControl(event) {
      const control = event.currentTarget;
      const beforeCursor = control.value.slice(0, control.selectionStart ?? control.value.length);
      const digitsBeforeCursor = beforeCursor.replace(/[^\d]/g, "").length;
      const formatted = formatAmountInput(control.value);
      control.value = formatted;
      let cursor = 0;
      let seenDigits = 0;
      while (cursor < formatted.length && seenDigits < digitsBeforeCursor) {
        if (/\d/.test(formatted[cursor])) seenDigits += 1;
        cursor += 1;
      }
      control.setSelectionRange(cursor, cursor);
    }

    function formatMonthDayControl(event) {
      const control = event.currentTarget;
      const raw = control.value.replace(/[^\d/]/g, "");
      if (raw.includes("/")) {
        const [month = "", day = ""] = raw.split("/");
        const monthDigits = month.replace(/\D/g, "").slice(0, 2);
        const dayDigits = day.replace(/\D/g, "").slice(0, 2);
        control.value = `${monthDigits}/${dayDigits}`;
      } else {
        const digits = raw.replace(/\D/g, "").slice(0, 4);
        control.value = digits.length > 2
          ? `${digits.slice(0, 2)}/${digits.slice(2)}`
          : digits;
      }
      const cursor = control.value.length;
      control.setSelectionRange(cursor, cursor);
    }

    function formatAmount(value) {
      const number = toNumber(value);
      if (!number) return "¥0";
      return new Intl.NumberFormat("ja-JP", {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0
      }).format(number);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }
  </script>
</body>
</html>
